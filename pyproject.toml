[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elec5305-noise-robust-urban-sound"
version = "0.1.0"
description = "Reproducible MFCC-SVM baseline and matched/mismatched noise experiments for UrbanSound8K"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "librosa>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "seaborn>=0.13",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
elec5305-baseline = "elec5305.baseline:main"
elec5305-experiment = "elec5305.experiment:main"
elec5305-analyse = "elec5305.analysis:main"
elec5305-plot-results = "elec5305.plot_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
